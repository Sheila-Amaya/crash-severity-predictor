# nginx del frontend: sirve la SPA compilada y hace de proxy de /api hacia el
# servicio api (mismo origen: el navegador no necesita CORS).
# __CSP_SCRIPT_HASHES__ lo reemplaza el Dockerfile con el hash del script
# inline que fija el tema (scripts/csp-hash.mjs).

server_tokens off;

# Docker DNS: el nombre "api" se resuelve en cada petición (no al arrancar), así
# nginx inicia aunque la API aún no esté lista y sigue a la API si se recrea.
resolver 127.0.0.11 valid=30s ipv6=off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/geo+json image/svg+xml;

map $sent_http_content_type $cache_html {
    default "";
    ~text/html "no-cache";
}

# -- Límites por IP (en modo servidor la IP real la fija ip-real.conf) ------
# /api en general: 10 peticiones/s con ráfaga de 30 (cargar el mapa dispara
# unas 6 a la vez y cada cambio de filtro otras 4). POST /api/predecir: 30
# por minuto con ráfaga de 10 (el simulador predice al enviar el formulario).
# Al superarlos: 429 con mensaje JSON y Retry-After.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
map $request_method $clave_predecir {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $clave_predecir zone=predecir:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# Protocolo original para la API: https detrás de Caddy, si no el propio
map $http_x_forwarded_proto $proto_original {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Peticiones pequeñas: solo hay GET y el POST del simulador (~200 bytes)
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    limit_conn conexiones 30;

    # Tiempos: cortar clientes lentos sin afectar a los normales (van aquí:
    # keepalive_timeout ya está definido en el http{} de la imagen)
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # -- Cabeceras de seguridad (en cada location: add_header no se hereda
    #    si la location define las suyas) ------------------------------
    # font-src admite data: porque Vite incrusta en el CSS las fuentes de menos
    # de 4 KB (un subconjunto de Inter); worker-src 'self' cubre el worker de
    # MapLibre, que se sirve desde /assets.
    set $csp "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # -- API: proxy al servicio interno ----------------------------------
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/proxy_api.conf;
    }

    location = /api/predecir {
        # Ambas zonas: la general y la del POST (GET queda en 405 por la API)
        limit_req zone=api burst=30 nodelay;
        limit_req zone=predecir burst=10 nodelay;
        include /etc/nginx/snippets/proxy_api.conf;
    }

    error_page 429 @limite;
    location @limite {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"message":"Demasiadas solicitudes. Espere unos segundos e intente de nuevo.","errors":[]}';
    }

    # -- Documentación interactiva de FastAPI: no se publica ---------------
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # -- Assets con hash en el nombre: caché larga e inmutable ----------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $csp always;
    }

    # -- Figuras del modelo (public/figuras): caché larga, pero sin immutable
    #    porque el nombre no lleva hash y una figura puede actualizarse ------
    location /figuras/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $csp always;
    }

    # -- SPA: rutas del navegador (/simulador, /acerca) vuelven a index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $cache_html always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $csp always;
        # HSTS la añade Caddy en modo servidor (docker-compose.prod.yml): por
        # HTTP (localhost:8080) no tiene sentido.
    }
}
