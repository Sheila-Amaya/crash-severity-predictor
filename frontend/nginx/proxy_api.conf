# Proxy de /api hacia el servicio interno (lo incluyen las locations de /api)
set $api http://api:8000;
proxy_pass $api;
proxy_http_version 1.1;
proxy_set_header Host $host;
# $remote_addr es la IP del cliente (en modo servidor, la que fija ip-real.conf)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $proto_original;
proxy_connect_timeout 5s;
proxy_send_timeout 10s;
# Las consultas tardan menos de 1 s; la base corta a los 10 s (statement_timeout)
proxy_read_timeout 30s;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
