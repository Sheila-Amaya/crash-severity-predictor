# Servicios comunes a los dos modos (no se usa solo). Lo extienden:
#   docker-compose.yml           -> con la base PostGIS en contenedor (por defecto)
#   docker-compose.supabase.yml  -> con una base externa (Supabase)

services:
  api:
    build:
      context: .
      # Verifica en el build que el modelo y SHAP cargan (no se copia a la imagen)
      additional_contexts:
        modelos: ./data/models
    image: severidad-vial/api:latest
    restart: unless-stopped
    environment:
      # Mismo origen vía nginx: sin CORS
      CORS_ORIGINS: ""
    volumes:
      # Modelo fuera de la imagen y de git; si falta, /api/predecir responde 503
      - ./data/models:/app/data/models:ro
    mem_limit: 1g

  web:
    build:
      context: ./frontend
      args:
        # Vacía = la API en el mismo origen (/api, vía el proxy de nginx)
        VITE_API_URL: ""
    image: severidad-vial/web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    mem_limit: 128m
