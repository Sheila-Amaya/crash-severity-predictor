# Solo en modo servidor (docker-compose.prod.yml lo monta en conf.d de web).
# nginx recibe todo desde Caddy, así que sin esto los límites por IP verían
# una sola IP (la de Caddy). Caddy reemplaza X-Forwarded-For con la IP real
# del cliente (no confía en la que trae la petición).
#
# Se confía en las redes privadas de Docker: en este modo web no publica
# puertos y solo lo alcanzan contenedores del propio stack. En modo local
# (puerto 8080 publicado) este archivo NO se usa, para que nadie pueda
# falsear su IP con la cabecera.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
